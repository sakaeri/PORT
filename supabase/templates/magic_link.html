<div style="font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; background-color: #faf8f3; border-radius: 12px;">
  <p style="font-size: 12px; letter-spacing: 0.1em; color: #8a7d5c; text-transform: uppercase; margin: 0 0 8px;">中央秘書事務所</p>
  <h2 style="font-size: 20px; color: #2b2b2b; margin: 0 0 16px; font-weight: 600;">ログインのご案内</h2>
  <p style="font-size: 14px; line-height: 1.8; color: #4a4a4a; margin: 0 0 24px;">
    下のボタンを押すとログインできます。
  </p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=magiclink" style="display: inline-block; padding: 14px 32px; background-color: #2f4f3f; color: #ffffff; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 600;">
      ログインする
    </a>
  </p>
  <p style="font-size: 13px; line-height: 1.8; color: #4a4a4a; margin: 0 0 8px;">
    確認コード
  </p>
  <p style="font-size: 26px; letter-spacing: 0.25em; font-weight: 600; color: #2b2b2b; margin: 0 0 24px;">{{ .Token }}</p>
  <p style="font-size: 12px; line-height: 1.7; color: #9a9a9a; margin: 0;">
    ボタンと確認コードは15分間有効です。このメールに心当たりがない場合は、お手数ですが破棄してください。<br>
    ちょっとした頼みごとも、まずはこちらから。中央秘書事務所
  </p>
</div>
